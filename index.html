<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday, my love!</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    background: #000;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; background: #000; overflow: hidden; }
  body { font-family: "Montserrat", "Arial", sans-serif; color: #fff; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .sub {
    position: fixed; left: 0; right: 0;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 7vh);
    text-align: center;
    font-weight: 600;
    font-size: clamp(.8rem, 3.2vw, 1.4rem);
    letter-spacing: .2em;
    color: #ffb3c9;
    text-shadow: 0 0 14px #e0115f;
    opacity: 0; transition: opacity 3s ease;
    pointer-events: none;
  }
  .sub.show { opacity: 1; }
</style>
</head>
<body>
<h1 class="sr">Happy Birthday, my love!</h1>
<canvas id="c"></canvas>
<div class="sub" id="sub">YOU ARE MY HAPPINESS ♥</div>
<script>
(function () {
  var cv = document.getElementById("c");
  var ctx = cv.getContext("2d");
  var W, H, dpr;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();

  function makeSprite(col, glow) {
    var s = document.createElement("canvas");
    s.width = s.height = 64;
    var g = s.getContext("2d");
    g.translate(32, 34);
    g.scale(1.6, 1.6);
    g.beginPath();
    g.moveTo(0, 8);
    g.bezierCurveTo(-18, -4, -10, -18, 0, -8);
    g.bezierCurveTo(10, -18, 18, -4, 0, 8);
    g.closePath();
    g.shadowColor = col; g.shadowBlur = glow;
    g.fillStyle = col;
    g.fill();
    return s;
  }
  var bgSprites = ["#ff2d6f", "#ff5c8d", "#e0115f", "#ff4d6d", "#b30f4b"].map(function (c) { return makeSprite(c, 5); });
  var textSprites = ["#ff6b9d", "#ff85a8", "#ff4d8d", "#ffa6c1", "#ff9ebd"].map(function (c) { return makeSprite(c, 4); });

  // Background hearts
  var COUNT = 1000, bg = [];
  function makeBg(initial) {
    var size = 4 + Math.random() * 9;
    var ang = Math.random() * 6.283, sp = 8 + Math.random() * 32;
    return {
      x: Math.random() * W,
      y: Math.random() * H,
      size: size,
      vx: Math.cos(ang) * sp,
      vy: Math.sin(ang) * sp,
      amp: 6 + Math.random() * 16,
      freq: .4 + Math.random() * 1.2,
      phase: Math.random() * 6.28,
      alpha: .2 + Math.random() * .5,
      tw: 1 + Math.random() * 3,
      sprite: bgSprites[Math.floor(Math.random() * bgSprites.length)]
    };
  }
  for (var i = 0; i < COUNT; i++) bg.push(makeBg(true));

  // Text made of hearts, one word at a time, each word fades in place
  var FONT = "'Montserrat', 'Arial Black', Arial, sans-serif";
  var words = [{ t: "HAPPY" }, { t: "BIRTHDAY" }, { t: "MY" }, { t: "LOVE", last: true }];

  function build() {
    var m = document.createElement("canvas").getContext("2d");
    var oc = document.createElement("canvas");
    oc.width = W; oc.height = H;
    var g = oc.getContext("2d");
    words.forEach(function (w) {
      m.font = "800 100px " + FONT;
      var w100 = m.measureText(w.t).width;
      var fs = Math.min(100 * (W * 0.9) / w100, Math.min(H * 0.35, 280));
      var gap = Math.max(3, Math.min(10, fs / 15));
      w.fs = fs;
      g.clearRect(0, 0, W, H);
      g.fillStyle = "#fff";
      g.font = "800 " + fs + "px " + FONT;
      g.textAlign = "center";
      g.textBaseline = "middle";
      g.fillText(w.t, W / 2, H / 2 - H * 0.03);
      var d = g.getImageData(0, 0, W, H).data;
      w.parts = [];
      for (var y = gap / 2; y < H; y += gap) {
        for (var x = gap / 2; x < W; x += gap) {
          if (d[(Math.floor(y) * W + Math.floor(x)) * 4 + 3] > 128) {
            w.parts.push({
              x: x + (Math.random() - .5) * gap * .3,
              y: y + (Math.random() - .5) * gap * .3,
              size: gap * 0.95,
              delay: Math.random() * 0.8,
              ph: Math.random() * 6.28,
              sprite: textSprites[Math.floor(Math.random() * textSprites.length)]
            });
          }
        }
      }
    });
  }

  var last = performance.now();
  function frame(now) {
    requestAnimationFrame(frame);
    if (window.innerWidth !== W || window.innerHeight !== H) { resize(); if (started) safeBuild(); }
    if (!W || !H) return;
    var dt = Math.min((now - last) / 1000, .05);
    last = now;
    ctx.clearRect(0, 0, W, H);

    for (var i = 0; i < bg.length; i++) {
      var h = bg[i];
      h.x += h.vx * dt;
      h.y += h.vy * dt;
      h.phase += h.freq * dt;
      if (h.x < -20) h.x = W + 20; else if (h.x > W + 20) h.x = -20;
      if (h.y < -20) h.y = H + 20; else if (h.y > H + 20) h.y = -20;
      var x = h.x + Math.sin(h.phase) * h.amp;
      var y = h.y + Math.cos(h.phase * .8) * h.amp;
      ctx.globalAlpha = h.alpha * (.6 + .4 * Math.sin(now / 1000 * h.tw + h.phase));
      ctx.drawImage(h.sprite, x - h.size, y - h.size, h.size * 2, h.size * 2);
    }

    for (var wi = 0; wi < words.length; wi++) {
      var w = words[wi];
      if (w.at === undefined) continue;
      var elapsed = (now - w.at) / 1000;
      var out = 1;
      if (!w.last) {
        out = 1 - Math.max(0, Math.min(1, (elapsed - 2.0) / 0.9));
        if (out <= 0) continue;
      }
      if (!w.parts || w.parts.length < 30) {
        ctx.globalAlpha = Math.max(0, Math.min(1, elapsed / 1.2)) * out;
        ctx.fillStyle = "#ff6b9d";
        ctx.shadowColor = "#ff2d6f";
        ctx.shadowBlur = 20;
        ctx.font = "800 " + (w.fs || Math.min(W * 0.16, H * 0.3)) + "px " + FONT;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(w.t, W / 2, H / 2 - H * 0.03);
        ctx.shadowBlur = 0;
        continue;
      }
      for (var n = 0; n < w.parts.length; n++) {
        var p = w.parts[n];
        var t = (elapsed - p.delay) / 1.0;
        if (t <= 0) continue;
        if (t > 1) t = 1;
        var a = t * t * (3 - 2 * t);
        ctx.globalAlpha = a * out * (.85 + .15 * Math.sin(now / 400 + p.ph * 3));
        ctx.drawImage(p.sprite, p.x - p.size, p.y - p.size, p.size * 2, p.size * 2);
      }
    }
    ctx.globalAlpha = 1;
  }

  requestAnimationFrame(frame);
  window.addEventListener("resize", function () { resize(); if (started) safeBuild(); });

  function start() {
    var STEP = 3200, T0 = 500;
    words.forEach(function (w, i) {
      setTimeout(function () { w.at = performance.now(); }, T0 + i * STEP);
    });
    setTimeout(function () {
      document.getElementById("sub").classList.add("show");
    }, T0 + (words.length - 1) * STEP + 2800);
    safeBuild();
  }

  function safeBuild() {
    resize();
    if (!W || !H) { setTimeout(safeBuild, 300); return; }
    try { build(); }
    catch (e) { words.forEach(function (w) { w.parts = []; }); }
  }

  var started = false;
  function go() { if (!started) { started = true; start(); } }
  if (document.fonts && document.fonts.load) {
    document.fonts.load("800 100px Montserrat", "HAPYBIRTDMLOVE").then(function () { go(); safeBuild(); }, go);
    setTimeout(go, 1200);
  } else {
    go();
  }
})();
</script>
</body>
</html>
